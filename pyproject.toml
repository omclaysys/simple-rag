[project]
name = "simple-rag"
version = "0.1.0"
description = "Simple RAG demo: chunk, embed with ChromaDB, retrieve top 3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb",
    "fastapi>=0.137.2",
    "pypdfium2>=5.10.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
