[project]
name = "simple-rag"
version = "0.1.0"
description = "Simple RAG demo: chunk, embed with ChromaDB, retrieve top 3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb",
    "docx2txt>=0.9",
    "fastapi>=0.137.2",
    "langchain>=1.3.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.6",
    "pypdfium2>=5.10.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
